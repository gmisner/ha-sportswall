<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Wall</title>
  <style>
    :root {
      --bg: #070a12;
      --bg2: #0c1220;
      --card: #121a2c;
      --card-live: #18243e;
      --ink: #f6f8fc;
      --muted: #94a2bc;
      --accent: #ffc448;
      --live: #ff4652;
      --line: #283654;
      --chip: #1c2840;
      --glass: linear-gradient(135deg, rgba(16,24,38,.92), rgba(8,17,31,.86));
    }
    html, body { height: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 110%, #152036 0%, transparent 55%),
        var(--bg);
      overflow: hidden;
    }
    body.broadcast { --bg:#08080a; --card:#16161a; --card-live:#201618; --accent:#ffd60a; --live:#e61c28; --muted:#a8a8b0; --line:#303036; --chip:#242428; --bg2:#101014; }
    body.night { --bg:#04060a; --card:#0c1018; --card-live:#101624; --ink:#a8b4c8; --muted:#58667c; --accent:#8caa78; --live:#b44646; --line:#1c2430; --bg2:#080c14; }
    body.daylight { --bg:#e8ecf2; --card:#fff; --card-live:#fff8f0; --ink:#121824; --muted:#5a667a; --accent:#c45a1c; --live:#c4242a; --line:#d6dce6; --chip:#ecf0f6; --bg2:#f4f6fa; }
    header {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 22px 36px 16px; border-bottom: 3px solid var(--accent);
    }
    .brand { font-size: 34px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .sub { color: var(--muted); margin-top: 4px; }
    .clock { font-size: 42px; font-weight: 800; text-align: right; line-height: 1; }
    .date { color: var(--muted); text-align: right; margin-top: 6px; }
    main { padding: 22px 28px 0; height: calc(100vh - 210px); }
    .empty { padding: 80px 20px; font-size: 32px; }
    .feature {
      height: calc(100% - 18px);
      background: var(--card);
      border-radius: 28px;
      padding: 22px 28px 18px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 12px;
    }
    .feature.live { background: var(--card-live); }
    .status-row { display: flex; justify-content: center; align-items: center; gap: 14px; }
    .pill {
      border-radius: 999px; padding: 8px 16px; font-weight: 800; letter-spacing: .06em;
      background: var(--chip);
    }
    .pill.live { background: var(--live); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .72; } }
    .league { color: var(--muted); font-weight: 700; }
    .matchup {
      display: grid; grid-template-columns: 1fr 140px 1fr; align-items: center; gap: 18px;
    }
    .team-card {
      background: var(--bg2); border-radius: 22px; padding: 22px; min-height: 220px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .logo {
      width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
    }
    .logo img { width: 78%; height: 78%; object-fit: contain; }
    .city { color: var(--muted); margin-top: 10px; font-size: 14px; }
    .name { font-size: 28px; font-weight: 800; }
    .abbr { font-size: 56px; font-weight: 800; margin-top: auto; }
    .score { font-size: 64px; font-weight: 800; }
    .center { text-align: center; }
    .vs {
      width: 72px; height: 72px; margin: 0 auto; border-radius: 50%;
      display: grid; place-items: center; background: var(--bg); color: var(--muted); font-weight: 800;
    }
    .detail { margin-top: 10px; font-weight: 700; }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .fact { background: var(--chip); border-radius: 16px; padding: 12px 14px; }
    .fact small { display: block; color: var(--accent); font-weight: 800; letter-spacing: .04em; font-size: 11px; }
    .fact b { display: block; margin-top: 4px; font-size: 15px; }
    .ticker-shell {
      position: fixed; left: 0; right: 0; bottom: 0; height: 92px;
      display: grid; grid-template-columns: 120px 1fr;
      background: var(--glass); border-top: 3px solid var(--accent); overflow: hidden;
    }
    .league-label {
      display: grid; place-items: center; font-weight: 800; letter-spacing: .08em;
      border-right: 1px solid var(--line); background: var(--chip);
    }
    .ticker-window { overflow: hidden; position: relative; }
    .ticker-track {
      display: flex; height: 100%; width: max-content;
      animation: ticker var(--ticker-duration, 48s) linear infinite;
    }
    .ticker-set { display: flex; height: 100%; }
    .ticker-game {
      width: 280px; min-width: 280px; display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 0 14px; border-right: 1px solid var(--line); font-weight: 800;
    }
    .ticker-game img, .ticker-fallback {
      width: 34px; height: 34px; border-radius: 50%; object-fit: contain;
    }
    .ticker-fallback { display: grid; place-items: center; font-size: 10px; background: var(--chip); }
    .live-status { color: var(--live); font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
    .kickoff, .final-status { font-size: 12px; color: var(--muted); }
    @keyframes ticker { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">Sports Wall</div>
      <div class="sub" id="subtitle">Loading today's games…</div>
    </div>
    <div>
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
    </div>
  </header>
  <main id="board"></main>
  <div class="ticker-shell" id="ticker"></div>
  <script>
    async function load() {
      try {
        const res = await fetch("board.json?t=" + Date.now(), { cache: "no-store" });
        render(await res.json());
      } catch (err) {
        document.getElementById("subtitle").textContent = "Waiting for Sports Wall to publish board.json";
      }
    }

    function render(data) {
      document.body.className = data.theme || "arena";
      document.getElementById("clock").textContent = data.clock || "";
      document.getElementById("date").textContent = data.date || "";
      document.getElementById("subtitle").textContent = data.subtitle || "";
      const games = data.games || [];
      const featured = data.featured || games[0];
      const root = document.getElementById("board");
      if (!featured) {
        root.innerHTML = '<div class="empty">No games on the board.</div>';
      } else {
        root.innerHTML = feature(featured);
      }
      document.getElementById("ticker").innerHTML = ticker(games, data.leagues || []);
    }

    function feature(game) {
      const away = game.away || {};
      const home = game.home || {};
      const live = game.status_kind === "live";
      return `
        <section class="feature${live ? " live" : ""}">
          <div class="status-row">
            <span class="pill${live ? " live" : ""}">${esc(live ? "LIVE" : game.status_kind === "final" ? "FINAL" : "UPCOMING")}</span>
            <span class="league">${esc([game.league_label, game.network].filter(Boolean).join(" · "))}</span>
          </div>
          <div class="matchup">
            ${teamCard(away, game.away_score)}
            <div class="center">
              <div class="vs">${game.status_kind === "pre" ? "@" : "VS"}</div>
              <div class="detail">${esc(game.status_meta || game.status_label || "")}</div>
            </div>
            ${teamCard(home, game.home_score)}
          </div>
          <div class="facts">
            <div class="fact"><small>TV</small><b>${esc(game.network || "TBD")}</b></div>
            <div class="fact"><small>WEATHER</small><b>${esc(game.weather_line || (game.indoor ? "Indoor" : "TBD"))}</b></div>
            <div class="fact"><small>VENUE</small><b>${esc(game.venue || game.venue_label || "")}</b></div>
            <div class="fact"><small>TRAVEL</small><b>${esc([game.travel_label, game.cities_route].filter(Boolean).join(" · ") || "TBD")}</b></div>
          </div>
        </section>`;
    }

    function teamCard(side, score) {
      const mark = side.logo_url
        ? `<img src="${esc(side.logo_url)}" alt="${esc(side.abbreviation)}">`
        : esc(side.abbreviation || "?");
      return `
        <div class="team-card">
          <div class="logo" style="background:#${side.color || "1a2848"}">${mark}</div>
          <div class="city">${esc(side.city_label || side.location || "")}</div>
          <div class="name">${esc(side.nickname || side.name || "")}</div>
          <div class="abbr">${esc(side.abbreviation || "")}</div>
          <div class="score">${esc(score || "—")}</div>
        </div>`;
    }

    function ticker(games, leagues) {
      const label = leagues.length === 1 ? leagues[0] : "SPORTS";
      if (!games.length) {
        return `<div class="league-label">${esc(label)}</div><div class="ticker-window"></div>`;
      }
      const chips = games.map(chip).join("");
      const duration = Math.max(18, games.length * 6);
      return `
        <div class="league-label">${esc(String(label).toUpperCase())}</div>
        <div class="ticker-window">
          <div class="ticker-track" style="--ticker-duration:${duration}s">
            <div class="ticker-set">${chips}</div>
            <div class="ticker-set" aria-hidden="true">${chips}</div>
          </div>
        </div>`;
    }

    function chip(game) {
      const away = game.away || {};
      const home = game.home || {};
      const score = game.status_kind === "pre"
        ? `<span>@</span>`
        : `<span>${esc(game.away_score)}</span><span>-</span><span>${esc(game.home_score)}</span>`;
      const status = game.status_kind === "live"
        ? `<span class="live-status"><span class="dot"></span>${esc(game.status_meta || "LIVE")}</span>`
        : `<span class="${game.status_kind === "final" ? "final-status" : "kickoff"}">${esc(game.status_label)}</span>`;
      return `<div class="ticker-game">${logo(away)}${esc(away.abbreviation)}${score}${esc(home.abbreviation)}${logo(home)}${status}</div>`;
    }

    function logo(side) {
      if (side.logo_url) return `<img src="${esc(side.logo_url)}" alt="${esc(side.abbreviation)}">`;
      return `<div class="ticker-fallback">${esc((side.abbreviation || "?").slice(0, 3))}</div>`;
    }

    function esc(value) {
      return String(value || "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    load();
    setInterval(load, 20000);
  </script>
</body>
</html>
